<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RETRO VAULT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Outfit:wght@400;600&display=swap">
<style>
:root{--bg:#0a0614;--pn:#150c26;--ln:#3b1d6b;--pu:#a855f7;--li:#e9d5ff;--mu:#a78bca;--ok:#4ade80;--wa:#f5b942;--no:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--li);font:16px/1.5 Outfit,system-ui,sans-serif;min-height:100vh}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px}
header{text-align:center;padding-top:20px}
body{overflow-x:hidden}
.mist{position:relative;width:130px;height:130px;margin:56px auto 0}
.mist:before,.mist:after{content:"";position:absolute;inset:-70px;border-radius:50%;background:radial-gradient(circle,#a855f78c 0%,#7c3aed40 42%,transparent 70%);filter:blur(18px);animation:mist 9s ease-in-out infinite alternate;z-index:0}
.mist:after{inset:-45px -120px;animation-duration:14s;animation-direction:alternate-reverse;opacity:.7}
.mist img{position:relative;z-index:1}.tag{position:relative;z-index:1}
@keyframes mist{from{transform:translateX(-14px) scale(.94);opacity:.55}to{transform:translateX(14px) scale(1.08);opacity:1}}
@media(prefers-reduced-motion:reduce){.mist:before,.mist:after{animation:none}}
header img{width:130px;height:130px;border-radius:50%;box-shadow:0 0 40px #a855f755}
h1,h2,h3{font-family:'Pirata One',Georgia,serif;font-weight:400;margin:0}
.tag{color:var(--mu);letter-spacing:.2em;margin:6px 0 16px}
nav.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;justify-content:safe center}
.chip,button,select,input{font:inherit}
.chip{flex:none;border:1px solid var(--ln);background:var(--pn);color:var(--li);padding:8px 16px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--pu);color:#12031f;border-color:var(--pu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:8px 0 40px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.card .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.35rem}.price{color:var(--pu);font-weight:600}
.btn{background:var(--pu);color:#12031f;border:0;padding:11px 16px;border-radius:4px;font-weight:600;cursor:pointer;margin-top:auto}
.btn:hover{background:#c084fc}.btn.g{background:transparent;color:var(--li);border:1px solid var(--ln)}
:focus-visible{outline:2px solid var(--li);outline-offset:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:50px 0}
.ov{position:fixed;inset:0;background:#000c;z-index:20;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.ov.on{display:flex}
.box{background:var(--pn);border:1px solid var(--pu);border-radius:8px;width:100%;max-width:460px;padding:20px;position:relative}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:.9rem}
input,select{width:100%;background:#0d0719;color:var(--li);border:1px solid var(--ln);border-radius:4px;padding:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.opt{display:flex;gap:8px;align-items:center;border:1px solid var(--ln);border-radius:4px;padding:10px;margin:0;color:var(--li);cursor:pointer}
.opt input{width:auto}
.sum{border-top:1px dashed var(--ln);margin-top:14px;padding-top:10px}.sum div{display:flex;justify-content:space-between}
.x{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--li);font-size:1.6rem;cursor:pointer}
.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.ord{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:12px;position:relative}
.ord .st{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.st button{border:1px solid var(--ln);background:#0d0719;color:var(--mu);padding:5px 9px;border-radius:4px;cursor:pointer;font-size:.8rem}
.st .waiting.on{background:var(--wa);color:#000}.st .confirmed.on{background:var(--ok);color:#000}.st .false.on{background:var(--no);color:#000}
.ord dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:36px 0 0}.ord dt{color:var(--mu)}.ord dd{margin:0}
.ship{display:grid;grid-template-columns:1fr 90px 90px;gap:6px;align-items:center;margin-bottom:6px}
.pl{flex-wrap:wrap;display:flex;gap:10px;align-items:center;background:var(--pn);border:1px solid var(--ln);padding:8px;border-radius:6px;margin-bottom:8px}
.vc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:6px;padding:4px 6px;margin:6px 6px 0 0}.vc img,.vc i{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#0d0719;border:1px solid var(--ln);display:inline-block}.vc .btn{padding:4px 8px;margin:0;font-size:.8rem}.vc input{padding:6px;width:130px}
.pl>img{width:56px;height:56px;object-fit:cover;border-radius:4px}.pl span{flex:1}.pl input{width:90px}
.note{background:#1d1033;border-left:3px solid var(--pu);padding:10px 12px;color:var(--mu);font-size:.9rem;margin:10px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pu);color:#12031f;padding:10px 18px;border-radius:4px;z-index:50;display:none}
footer{text-align:center;color:var(--mu);padding:24px 16px 40px;font-size:.85rem}footer a{color:var(--mu)}
@media(max-width:560px){.ord .st{position:static;margin-bottom:6px}.ord dl{margin-top:6px}}
